<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050E18"/>
      <stop offset="50%" stop-color="#0A1E32"/>
      <stop offset="100%" stop-color="#03080E"/>
    </linearGradient>

    <linearGradient id="goldSunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="450" rx="24" fill="url(#bgGrad)"/>
  <rect width="898" height="448" x="1" y="1" rx="23" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="450" cy="180" r="160" fill="#1D9BF0" opacity="0.08" filter="blur(60px)"/>
  <circle cx="560" cy="140" r="120" fill="#F59E0B" opacity="0.10" filter="blur(50px)"/>

  <!-- Type Type Badge -->
  <g transform="translate(450, 48)">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <text text-anchor="middle" y="5" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="2">
      TYPE 1 • شـعـار الـكـلـمـة الـكـامـلـة (WORDMARK)
    </text>
  </g>

  <!-- Main Typographic Lockup (Bespoke Lettering) -->
  <g transform="translate(450, 210)" id="ArabicWordmark">

    <!-- Stylized Arabic Wordmark: واحة نـور -->

    <!-- Glow Backing for Arabic Text -->
    <g opacity="0.15" filter="url(#glowCyan)">
      <!-- Duplicate paths for ambient luminescence -->
    </g>

    <!-- Path Group: "واحـة" (Wahet) - Right Segment -->
    <g id="Wahet_Segment" transform="translate(80, 0)">
      <!-- Letter Waw (و) with integrated Oasis Leaf loop -->
      <path d="M 120 20 C 135 20, 150 5, 150 -15 C 150 -40, 125 -60, 95 -60 C 65 -60, 45 -40, 45 -15 C 45 10, 65 30, 95 30 C 120 30, 140 10, 145 -5" 
            fill="none" stroke="url(#letterGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Inner Oasis Leaf in Waw loop (Technique: Negative Space & Symbolism) -->
      <path d="M 95 -45 C 108 -45, 118 -35, 118 -20 C 105 -20, 95 -30, 95 -45 Z" fill="url(#emeraldGrad)"/>
      <path d="M 95 -45 C 82 -45, 72 -35, 72 -20 C 85 -20, 95 -30, 95 -45 Z" fill="#34D399" opacity="0.8"/>

      <!-- Letter Alif (ا) with sleek vertical flare -->
      <path d="M 30 -65 L 30 25" fill="none" stroke="url(#letterGrad)" stroke-width="14" stroke-linecap="round"/>

      <!-- Letters Haa & Taa Marbuta (حة) -->
      <path d="M 15 -10 C -10 -40, -40 -40, -65 -15 C -80 0, -65 25, -35 25 L 15 25" 
            fill="none" stroke="url(#letterGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Taa Marbuta loop up -->
      <path d="M -60 25 C -75 25, -95 10, -95 -20 C -95 -50, -65 -65, -35 -65" 
            fill="none" stroke="url(#letterGrad)" stroke-width="13" stroke-linecap="round"/>
      <!-- Dots for Taa Marbuta as dual vitality seeds -->
      <circle cx="-55" cy="-80" r="5" fill="#38BDF8"/>
      <circle cx="-72" cy="-80" r="5" fill="#34D399"/>
    </g>

    <!-- Path Group: "نـور" (Nour) - Left Segment -->
    <g id="Nour_Segment" transform="translate(-150, 0)">
      <!-- Letter Noon (ن) dynamic sweeping cradle -->
      <path d="M 40 -35 L 40 5 C 40 40, -10 50, -50 45 C -90 40, -110 15, -110 -15" 
            fill="none" stroke="url(#cyanGrad)" stroke-width="14" stroke-linecap="round"/>

      <!-- NOUN DOT: THE RADIANT SUN (Technique: Letter Manipulation & Literal Translation) -->
      <g transform="translate(-35, -45)" filter="url(#glowGold)">
        <!-- Sun Core -->
        <circle cx="0" cy="0" r="14" fill="url(#goldSunGrad)"/>
        <!-- 8 Solar Rays -->
        <path d="M 0 -22 L 0 -17 M 0 17 L 0 22 M -22 0 L -17 0 M 17 0 L 22 0 M -15 -15 L -11 -11 M 11 11 L 15 15 M 15 -15 L 11 -11 M -11 11 L -15 15" 
              stroke="#FDE047" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- Letter Waw (و) of Nour -->
      <path d="M -50 -10 C -40 -35, -70 -50, -95 -35 C -115 -20, -115 10, -90 25 L -75 25" 
            fill="none" stroke="url(#letterGrad)" stroke-width="13" stroke-linecap="round"/>

      <!-- Letter Raa (ر) of Nour - Sweeps into an energetic vitality upward leaf -->
      <path d="M -115 15 C -135 15, -155 35, -170 55 C -185 70, -205 75, -225 65" 
            fill="none" stroke="url(#emeraldGrad)" stroke-width="14" stroke-linecap="round"/>
      <!-- Flourish Growth Tip (Technique: Visual Double Entendre) -->
      <path d="M -225 65 C -240 55, -235 40, -220 40 C -205 40, -215 60, -225 65 Z" fill="url(#emeraldGrad)"/>
    </g>

    <!-- Dynamic Metabolic Connecting Pulse Underline -->
    <path d="M -230 95 L 30 95 L 45 80 L 60 110 L 75 95 L 230 95" 
          fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" opacity="0.6" stroke-linecap="round"/>
    <circle cx="60" cy="110" r="3.5" fill="#F59E0B" filter="url(#glowGold)"/>
  </g>

  <!-- English Secondary Brand Typography -->
  <g transform="translate(450, 360)">
    <text text-anchor="middle" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="14">
      WAHET NOUR
    </text>
    <text text-anchor="middle" y="28" font-family="'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#38BDF8" letter-spacing="6">
      LIFESTYLE • METABOLIC HEALTH • NUTRITION
    </text>
  </g>

  <!-- Concept Technique Badges at Bottom -->
  <g transform="translate(450, 422)">
    <text text-anchor="middle" font-family="'Cairo', sans-serif" font-size="11" fill="rgba(255,255,255,0.45)">
      التكنيك المستخدم: تلاعب بالحروف (Letter Manipulation) + شمس النور المشرقة كـ نون + سعفة الواحة في الـ واو
    </text>
  </g>
</svg>
