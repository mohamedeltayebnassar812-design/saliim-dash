<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050E18"/>
      <stop offset="50%" stop-color="#091A2D"/>
      <stop offset="100%" stop-color="#03080E"/>
    </linearGradient>

    <!-- Sun Golden Radiance Gradient -->
    <linearGradient id="sunGoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>

    <!-- Oasis Emerald Leaves Gradient -->
    <linearGradient id="oasisLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="60%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>

    <!-- Water Spring Droplet Gradient -->
    <linearGradient id="springDropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <filter id="solarGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="450" rx="24" fill="url(#bgGrad3)"/>
  <rect width="898" height="448" x="1" y="1" rx="23" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Ambient Glow -->
  <circle cx="280" cy="225" r="140" fill="#F59E0B" opacity="0.12" filter="blur(60px)"/>
  <circle cx="280" cy="245" r="120" fill="#10B981" opacity="0.10" filter="blur(50px)"/>

  <!-- Type Badge -->
  <g transform="translate(450, 48)">
    <rect x="-195" y="-16" width="390" height="32" rx="16" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1"/>
    <text text-anchor="middle" y="5" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-size="12" font-weight="700" fill="#FBBF24" letter-spacing="2">
      TYPE 3 • الـشـعـار الـرمـزي أو الأيـقـونـي (PICTORIAL / BRAND MARK)
    </text>
  </g>

  <!-- Left: Pure Iconic Mark (Rising Sun + Oasis Fronds + Spring Teardrop) -->
  <g transform="translate(260, 225)" filter="url(#leafShadow)">

    <!-- 1. The Radiant Dawn Sunburst (Nour / Light) -->
    <g transform="translate(0, -35)">
      <!-- Outer Corona Halo -->
      <circle cx="0" cy="0" r="62" fill="none" stroke="rgba(245,158,11,0.2)" stroke-width="2" stroke-dasharray="4,6"/>

      <!-- Radiant Sun Rays (7 Rays representing 7 days of vital discipline) -->
      <!-- Ray Top -->
      <path d="M 0 -78 L 0 -58" stroke="url(#sunGoldGrad)" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Rays 30 deg -->
      <path d="M 33 -70 L 23 -52" stroke="url(#sunGoldGrad)" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M -33 -70 L -23 -52" stroke="url(#sunGoldGrad)" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Rays 60 deg -->
      <path d="M 58 -46 L 43 -35" stroke="url(#sunGoldGrad)" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M -58 -46 L -43 -35" stroke="url(#sunGoldGrad)" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Rays 90 deg -->
      <path d="M 72 -10 L 52 -10" stroke="url(#sunGoldGrad)" stroke-width="4" stroke-linecap="round"/>
      <path d="M -72 -10 L -52 -10" stroke="url(#sunGoldGrad)" stroke-width="4" stroke-linecap="round"/>

      <!-- Semicircular Rising Sun Disc -->
      <path d="M -48 0 A 48 48 0 0 1 48 0 Z" fill="url(#sunGoldGrad)" filter="url(#solarGlow)"/>
    </g>

    <!-- 2. Dual Oasis Palm Fronds (Wahet / Life & Fertility) -->
    <!-- Left Leaf Frond -->
    <path d="M 0 75 C -35 75, -75 40, -85 -10 C -85 -45, -60 -70, -45 -80 C -45 -50, -35 -20, 0 10" 
          fill="url(#oasisLeafGrad)" opacity="0.95"/>
    <path d="M -45 -80 C -55 -40, -45 5, 0 45" 
          fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>

    <!-- Right Leaf Frond -->
    <path d="M 0 75 C 35 75, 75 40, 85 -10 C 85 -45, 60 -70, 45 -80 C 45 -50, 35 -20, 0 10" 
          fill="url(#oasisLeafGrad)" opacity="0.95"/>
    <path d="M 45 -80 C 55 -40, 45 5, 0 45" 
          fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>

    <!-- 3. Central Oasis Vitality Teardrop (Spring Springwater / Hydration) -->
    <g transform="translate(0, 25)">
      <path d="M 0 -38 C 16 -12, 24 6, 24 20 C 24 34, 13 45, 0 45 C -13 45, -24 34, -24 20 C -24 6, -16 -12, 0 -38 Z" 
            fill="url(#springDropGrad)"/>
      <!-- Inner Specular Light Glint -->
      <ellipse cx="-7" cy="15" rx="5" ry="10" transform="rotate(-20, -7, 15)" fill="#FFFFFF" opacity="0.5"/>
      <circle cx="5" cy="28" r="3" fill="#FFFFFF" opacity="0.4"/>
    </g>

    <!-- Base Stem Pedestal -->
    <path d="M -12 75 C 0 85, 0 85, 12 75 L 0 95 Z" fill="#047857"/>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="430" y1="120" x2="430" y2="340" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="6,6"/>

  <!-- Right Side: Brand Presentation & Rationale -->
  <g transform="translate(480, 160)">
    <!-- Arabic Name -->
    <text font-family="'Cairo', sans-serif" font-size="36" font-weight="800" fill="#FFFFFF">
      واحـة نـور
    </text>

    <!-- English Brand Full Name -->
    <text y="42" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#FBBF24" letter-spacing="8">
      WAHET NOUR
    </text>

    <!-- Category -->
    <text y="80" font-family="'Cairo', sans-serif" font-size="16" font-weight="600" fill="#38BDF8">
      الأيـقـونـة الـرمـزيـة الـبـصـريـة الـحـيـة
    </text>
    <text y="105" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="3">
      ICONIC DAWN &amp; OASIS EMBLEM
    </text>

    <!-- Explanation Points -->
    <g transform="translate(0, 135)">
      <!-- Bullet 1 -->
      <circle cx="8" cy="8" r="4" fill="#F59E0B"/>
      <text x="22" y="12" font-family="'Cairo', sans-serif" font-size="13" fill="#E2E8F0">
        <tspan font-weight="700" fill="#FBBF24">شمس النور (Dawn Sun):</tspan> 7 أشعة للطاقة والصحو والأيض النشط
      </text>

      <!-- Bullet 2 -->
      <circle cx="8" cy="38" r="4" fill="#10B981"/>
      <text x="22" y="42" font-family="'Cairo', sans-serif" font-size="13" fill="#E2E8F0">
        <tspan font-weight="700" fill="#34D399">سعفتا الواحة (Oasis Fronds):</tspan> رمز النماء والحماية والوفرة الصحية
      </text>

      <!-- Bullet 3 -->
      <circle cx="8" cy="68" r="4" fill="#38BDF8"/>
      <text x="22" y="72" font-family="'Cairo', sans-serif" font-size="13" fill="#E2E8F0">
        <tspan font-weight="700" fill="#7DD3FC">قطرة النبع الخلوي (Vitality Drop):</tspan> النقاء، الترطيب، والتجدد الحيوي
      </text>
    </g>
  </g>

  <!-- Concept Technique Badges at Bottom -->
  <g transform="translate(450, 422)">
    <text text-anchor="middle" font-family="'Cairo', sans-serif" font-size="11" fill="rgba(255,255,255,0.45)">
      التكنيك المستخدم: الترجمة الحرفية (Literal Translation) + الرمزية الطبيعية (Natural Symbolism) لأيقونة بصرية سهلة التعلق بالذاكرة
    </text>
  </g>
</svg>
