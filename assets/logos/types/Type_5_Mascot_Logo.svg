<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040D17"/>
      <stop offset="50%" stop-color="#091A2C"/>
      <stop offset="100%" stop-color="#02060C"/>
    </linearGradient>

    <!-- Gazelle Athletic Gold Gradient -->
    <linearGradient id="mascotGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Athletic Cyan Gradient -->
    <linearGradient id="mascotCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>

    <!-- Vitality Emerald -->
    <linearGradient id="mascotEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="mascotGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="mascotShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="450" rx="24" fill="url(#bgGrad5)"/>
  <rect width="898" height="448" x="1" y="1" rx="23" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Ambient Glow -->
  <circle cx="260" cy="225" r="140" fill="#F59E0B" opacity="0.10" filter="blur(60px)"/>
  <circle cx="260" cy="245" r="120" fill="#38BDF8" opacity="0.10" filter="blur(50px)"/>

  <!-- Type Badge -->
  <g transform="translate(450, 48)">
    <rect x="-195" y="-16" width="390" height="32" rx="16" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1"/>
    <text text-anchor="middle" y="5" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-size="12" font-weight="700" fill="#FBBF24" letter-spacing="2">
      TYPE 5 • شـعـار الـشـخـصـيـة / الـسـفـيـر (MASCOT LOGO)
    </text>
  </g>

  <!-- Left: Athletic Vitality Mascot ("غـزال الـنـور / The Vitality Gazelle") -->
  <g transform="translate(260, 225)" filter="url(#mascotShadow)">

    <!-- Circular Athletic Crest Badge Ring -->
    <circle cx="0" cy="5" r="95" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
    <circle cx="0" cy="5" r="90" fill="rgba(7, 22, 38, 0.6)"/>

    <!-- Dynamic Athletic Gazelle / Oryx Faceted Head Silhouette -->

    <!-- Back Horn (Left) - Sleek Rising Curved Antler/Ray of Light -->
    <path d="M -18 -35 C -35 -70, -35 -115, -20 -140 C -12 -135, -18 -95, -5 -50 Z" 
          fill="url(#mascotGold)" opacity="0.85"/>

    <!-- Front Horn (Right) - Main Radiant Crown Antler -->
    <path d="M -5 -35 C -15 -80, -10 -125, 10 -150 C 18 -145, 5 -100, 10 -45 Z" 
          fill="url(#mascotGold)"/>

    <!-- Horn Ridge Marks (Geometric Steps of Growth) -->
    <line x1="-12" y1="-70" x2="-2" y2="-65" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <line x1="-9" y1="-95" x2="2" y2="-90" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <line x1="-5" y1="-120" x2="6" y2="-115" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>

    <!-- Golden Solar Star Between Antlers (Technique: Symbolism) -->
    <g transform="translate(25, -130)" filter="url(#mascotGlow)">
      <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#FDE047"/>
    </g>

    <!-- Athletic Head Profile & Muzzle -->
    <!-- Forehead to Nose bridge -->
    <path d="M -5 -35 L 35 -15 L 58 10 L 52 25 L 20 22 L 0 52 L -35 65 L -45 40 L -25 5 L -10 -35 Z" 
          fill="#0F2B48"/>

    <!-- Upper Snout Facet (Light Highlight) -->
    <polygon points="-5,-35 25,-12 35,-15" fill="#38BDF8" opacity="0.4"/>
    <polygon points="25,-12 58,10 40,8" fill="url(#mascotCyan)"/>
    <polygon points="40,8 58,10 52,25 32,20" fill="#0284C7"/>

    <!-- Athletic Keen Eye (Alert, Focused Lifestyle Determination) -->
    <g transform="translate(14, -8)">
      <polygon points="0,-4 14,0 2,4 -4,0" fill="#FBBF24"/>
      <circle cx="5" cy="0" r="2.5" fill="#FFFFFF"/>
    </g>

    <!-- Cheek & Jaw Facet (Strength & Bone Structure) -->
    <polygon points="20,22 32,20 0,52 -15,35" fill="url(#mascotEmerald)"/>
    <polygon points="0,52 -35,65 -15,35" fill="#065F46"/>

    <!-- Sleek Alert Ear -->
    <path d="M -22 -35 C -45 -45, -55 -35, -50 -15 C -40 -12, -30 -22, -22 -35 Z" 
          fill="url(#mascotCyan)"/>

    <!-- Powerful Athletic Neck & Chest Arc (Endurance & Form) -->
    <path d="M -35 65 L -55 105 L 10 105 L 0 52 Z" fill="#0A1E32"/>
    <path d="M -15 80 L 25 105 L -5 105 Z" fill="url(#mascotCyan)" opacity="0.3"/>

    <!-- Dynamic Metabolic Collar / Energy Ribbon across chest -->
    <path d="M -50 92 C -10 102, 20 95, 45 78" 
          fill="none" stroke="url(#mascotGold)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="45" cy="78" r="4" fill="#FDE047" filter="url(#mascotGlow)"/>

    <!-- Base Laurel / Oasis Fronds Framing the Badge Base -->
    <path d="M -70 50 C -75 75, -55 90, -35 98" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    <path d="M 70 50 C 75 75, 55 90, 35 98" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="430" y1="120" x2="430" y2="340" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="6,6"/>

  <!-- Right Side: Brand Presentation & Rationale -->
  <g transform="translate(480, 160)">
    <!-- Arabic Name -->
    <text font-family="'Cairo', sans-serif" font-size="36" font-weight="800" fill="#FFFFFF">
      غـزال الـنـور
    </text>

    <!-- English Brand Full Name -->
    <text y="42" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#FBBF24" letter-spacing="6">
      THE NOUR GAZELLE • MASCOT
    </text>

    <!-- Category -->
    <text y="80" font-family="'Cairo', sans-serif" font-size="16" font-weight="600" fill="#38BDF8">
      سـفـيـر الـرشـاقـة والـحـيـويـة الأيـضـيـة
    </text>
    <text y="105" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="3">
      ATHLETIC LIFESTYLE AMBASSADOR
    </text>

    <!-- Explanation Points -->
    <g transform="translate(0, 135)">
      <!-- Bullet 1 -->
      <circle cx="8" cy="8" r="4" fill="#F59E0B"/>
      <text x="22" y="12" font-family="'Cairo', sans-serif" font-size="13" fill="#E2E8F0">
        <tspan font-weight="700" fill="#FBBF24">رشاقة الغزال العربي:</tspan> رمز اللياقة الخفيفة، السرعة، وغياب الدهون الحشوية
      </text>

      <!-- Bullet 2 -->
      <circle cx="8" cy="38" r="4" fill="#38BDF8"/>
      <text x="22" y="42" font-family="'Cairo', sans-serif" font-size="13" fill="#E2E8F0">
        <tspan font-weight="700" fill="#7DD3FC">قرون شعاع النور (Solar Antlers):</tspan> قرون هندسية تنبثق منها أشعة الطاقة والشمس
      </text>

      <!-- Bullet 3 -->
      <circle cx="8" cy="68" r="4" fill="#10B981"/>
      <text x="22" y="72" font-family="'Cairo', sans-serif" font-size="13" fill="#E2E8F0">
        <tspan font-weight="700" fill="#34D399">نظرة التركيز واليقظة:</tspan> سفير ملهم للأبطال والمشتركين في التحدي اليومي
      </text>
    </g>
  </g>

  <!-- Concept Technique Badges at Bottom -->
  <g transform="translate(450, 422)">
    <text text-anchor="middle" font-family="'Cairo', sans-serif" font-size="11" fill="rgba(255,255,255,0.45)">
      التكنيك المستخدم: شخصية وسفير براند فاخر وهندسي (Geometric Mascot) يجمع بين هوية الواحة والرشاقة الجسدية العالية
    </text>
  </g>
</svg>
