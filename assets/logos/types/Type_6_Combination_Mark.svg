<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040C16"/>
      <stop offset="50%" stop-color="#091A2D"/>
      <stop offset="100%" stop-color="#02060C"/>
    </linearGradient>

    <!-- Sun Gold Gradient -->
    <linearGradient id="combGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>

    <!-- Cyan Pulse Gradient -->
    <linearGradient id="combCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Emerald Leaf Gradient -->
    <linearGradient id="combEmerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <filter id="combGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="combShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="450" rx="24" fill="url(#bgGrad6)"/>
  <rect width="898" height="448" x="1" y="1" rx="23" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Ambient Luminescence -->
  <circle cx="450" cy="150" r="160" fill="#F59E0B" opacity="0.08" filter="blur(60px)"/>
  <circle cx="450" cy="220" r="180" fill="#1D9BF0" opacity="0.07" filter="blur(70px)"/>

  <!-- Type Badge -->
  <g transform="translate(450, 42)">
    <rect x="-195" y="-16" width="390" height="32" rx="16" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
    <text text-anchor="middle" y="5" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="2">
      TYPE 6 • الـشـعـار الـتـركـيـبـي (COMBINATION MARK)
    </text>
  </g>

  <!-- Centered Flagship Master Combination Lockup -->
  <g transform="translate(450, 155)" filter="url(#combShadow)">

    <!-- Upper Mark: The Harmonic Oasis & Nour Symbol -->
    <g transform="translate(0, 0)">
      <!-- Outer Solar Halo Arc -->
      <path d="M -50 -5 A 50 50 0 0 1 50 -5" fill="none" stroke="rgba(245,158,11,0.3)" stroke-width="2" stroke-dasharray="3,5"/>

      <!-- Radiant 5 Sun Rays -->
      <path d="M 0 -62 L 0 -48" stroke="url(#combGold)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 32 -54 L 22 -42" stroke="url(#combGold)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M -32 -54 L -22 -42" stroke="url(#combGold)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 52 -30 L 40 -22" stroke="url(#combGold)" stroke-width="3" stroke-linecap="round"/>
      <path d="M -52 -30 L -40 -22" stroke="url(#combGold)" stroke-width="3" stroke-linecap="round"/>

      <!-- Rising Solar Core Semi-circle -->
      <path d="M -36 -2 A 36 36 0 0 1 36 -2 Z" fill="url(#combGold)" filter="url(#combGlow)"/>

      <!-- Left Sculpted Oasis Leaf (Nourishing Branch) -->
      <path d="M 0 45 C -25 45, -55 20, -60 -15 C -60 -40, -42 -55, -30 -62 C -30 -38, -22 -15, 0 6" 
            fill="url(#combEmerald)"/>

      <!-- Right Sculpted Oasis Leaf (Metabolic Vitality) -->
      <path d="M 0 45 C 25 45, 55 20, 60 -15 C 60 -40, 42 -55, 30 -62 C 30 -38, 22 -15, 0 6" 
            fill="url(#combEmerald)"/>

      <!-- Central Metabolic Spring Water Droplet -->
      <path d="M 0 -8 C 10 10, 16 22, 16 32 C 16 42, 9 48, 0 48 C -9 48, -16 42, -16 32 C -16 22, -10 10, 0 -8 Z" 
            fill="url(#combCyan)"/>
      <ellipse cx="-4" cy="28" rx="3.5" ry="7" transform="rotate(-15, -4, 28)" fill="#FFFFFF" opacity="0.6"/>
    </g>

    <!-- Lower Component: Premium Arabic Typographic Lettering -->
    <g transform="translate(0, 115)">
      <!-- Master Arabic Text: واحـة نـور -->
      <text text-anchor="middle" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" letter-spacing="1">
        واحــة نـــور
      </text>

      <!-- Radiant Sun Diacritic over the letter Noun (ن) -->
      <g transform="translate(30, -56)" filter="url(#combGlow)">
        <circle cx="0" cy="0" r="6" fill="#FDE047"/>
        <line x1="0" y1="-10" x2="0" y2="-7" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
        <line x1="0" y1="7" x2="0" y2="10" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
        <line x1="-10" y1="0" x2="-7" y2="0" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
        <line x1="7" y1="0" x2="10" y2="0" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Connecting Metabolic Dynamic Line -->
    <g transform="translate(0, 142)">
      <line x1="-180" y1="0" x2="-35" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
      <circle cx="-35" cy="0" r="3" fill="#10B981"/>
      <!-- Center Emblem Mini Icon -->
      <polygon points="0,-6 6,0 0,6 -6,0" fill="#F59E0B"/>
      <circle cx="35" cy="0" r="3" fill="#38BDF8"/>
      <line x1="35" y1="0" x2="180" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    </g>

    <!-- English Brand Full Name & Slogan -->
    <g transform="translate(0, 168)">
      <text text-anchor="middle" font-family="'Inter', 'Montserrat', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" letter-spacing="10">
        WAHET NOUR
      </text>
      <text text-anchor="middle" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#38BDF8" letter-spacing="5">
        LIFESTYLE • METABOLIC HEALTH • HABIT MASTERY
      </text>
    </g>
  </g>

  <!-- Concept Technique Badges at Bottom -->
  <g transform="translate(450, 424)">
    <text text-anchor="middle" font-family="'Cairo', sans-serif" font-size="11" fill="rgba(255,255,255,0.45)">
      التكنيك المستخدم: الشعار التركيبي القياسي (Master Combination Mark) يدمج الرمز البصري مع التايبوغرافي في توازن وتطابق تجاري متكامل
    </text>
  </g>
</svg>
